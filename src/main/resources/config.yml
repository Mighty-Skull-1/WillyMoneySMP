config-version: 6

starting-draft-credits: 300
starting-game-credits: 100

rewards:
  captain-kill: 25
  tier-a-kill: 15
  tier-b-kill: 10
  tier-c-kill: 10
  # King of the Hill: most seconds holding the hill
  koth:
    1st: 125
    2nd: 100
    3rd: 75
    4th: 50
    5th: 25
  # Team Deathmatch (/ffa or /tdm) placings: placed by when each team is wiped out, last team standing = 1st
  ffa:
    1st: 125
    2nd: 100
    3rd: 75
    4th: 50
    5th: 25
  # Bingo: paid when bingo ends, by most squares claimed
  bingo-rewards:
    1st: 150
    2nd: 120
    3rd: 100
    4th: 50
    5th: 25

elimination:
  enabled: false
  lightning-on-death: false

auto-save-interval-minutes: 5

# Free Fall (Finale Showdown): /freefall start [minutes] [finalSize]
freefall:
  start-size: 1000        # border width when Free Fall starts
  end-size: 50            # border width when it stops shrinking
  shrink-minutes: 20      # how long it takes to shrink
  damage-per-block: 1.0   # damage per second per block outside the border
  # center-x / center-z are set with /freefall center (default: world spawn)

# Draft auctions (/bid nominate <player>, then captains type /bid)
draft:
  auction-seconds: 30        # how long each player is up for auction
  bid-increment: 5           # every bid is exactly this much higher: 5, 10, 15, 20...
  reset-timer-on-bid: false  # false = the clock just counts down; true = each bid puts it back to auction-seconds

# Minecraft server address shown on the website's Join panel. Change it in game with /smp setip <address>
server-address: willymoneysmp.minefort.com

# Website shown on the scoreboard, tab list and /website
website-url: https://willy-money-smp-web.vercel.app/

# Live website sync (https://github.com/Mighty-Skull-1/WillyMoneySMPWeb)
# Updates are signed with the key in web-signing-key.properties so nobody can post fake standings.
# ntfy-topic must match NTFY_TOPIC in the website's src/config.ts.
web-sync:
  enabled: true
  ntfy-server: https://ntfy.sh
  ntfy-topic: willymoneysmp_leaderboard_live
  heartbeat-seconds: 60

# Optional local REST API (the website does not need this).
web-server:
  enabled: false
  port: 8085

# King of the Hill event settings
koth:
  duration-seconds: 300   # 5 minutes
  give-sword: true        # everyone on a team gets a Knockback II wooden sword when KOTH starts
  sword-uses: 5           # roughly how many hits before the sword breaks

# Team Deathmatch (/ffa or /tdm)
ffa:
  kill-bonus: 20              # every kill during the deathmatch pays this much extra
  bounty-bonus: 20            # killing someone from the glowing bounty tier pays this much more on top
  bounty-rotate-seconds: 240  # bounty tier changes every 4 minutes
  bounty-order: [CAPTAIN, C, A, B]
